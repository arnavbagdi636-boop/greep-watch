name: watch

on:
  schedule:
    # GitHub deprioritises schedules on low-traffic repos, so this fires far
    # less often than every 5 minutes. It is a fallback, not the main trigger.
    - cron: "*/5 * * * *"
  # The reliable trigger: an external scheduler POSTs here.
  repository_dispatch:
    types: [watch]
  workflow_dispatch:

# One watcher at a time. A new trigger cancels a run that is already going,
# so a fresh 5.5-hour window starts rather than two overlapping ones.
concurrency:
  group: watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Public-repo jobs can run up to 6h. Stay under it with room to spare.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Watch for 5.5 hours, checking every 5 minutes
        env:
          BOOKINGS_BUSINESS: ${{ secrets.BOOKINGS_BUSINESS }}
          BOOKINGS_SERVICE_ID: ${{ secrets.BOOKINGS_SERVICE_ID }}
          BOOKINGS_STAFF_ID: ${{ secrets.BOOKINGS_STAFF_ID }}
          CURRENT_BOOKING: ${{ secrets.CURRENT_BOOKING }}
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICE_MINUTES: "20"
          EARLIEST_TIME: "16:30"
        run: python check.py --minutes 330 --interval 300

      - name: Persist dedup state
        # Runs even if the watch step is cancelled by a newer trigger, so a
        # slot alerted just before cancellation is not re-alerted later.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "greep-watch"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || true
          else
            echo "no state change"
          fi
